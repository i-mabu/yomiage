services:
  voicevox_engine:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: voicevox_engine
    restart: unless-stopped
    ports:
      - "50021:50021"

  bot_a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yomiage_bot_a
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${BOT_A_TOKEN}
      VOICEVOX_URL: http://voicevox_engine:50021
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      voicevox_engine:
        condition: service_started

  bot_b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yomiage_bot_b
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${BOT_B_TOKEN}
      VOICEVOX_URL: http://voicevox_engine:50021
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      voicevox_engine:
        condition: service_started

  bot_c:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yomiage_bot_c
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${BOT_C_TOKEN}
      VOICEVOX_URL: http://voicevox_engine:50021
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      voicevox_engine:
        condition: service_started
